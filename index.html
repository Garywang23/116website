        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #333;
            min-height: 100vh;
            padding: 30px 20px;
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: #1a73e8;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .item {
            display: flex;
            align-items: flex-start;
            background: #f8f9fa;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            padding: 14px 16px;
            text-decoration: none;
            color: #333;
            transition: box-shadow 0.2s, transform 0.1s;
        }
        .item:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .rank {
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            background: #1a73e8;
            border-radius: 50%;
            min-width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .rank.top3 { background: #e53935; }
        .rank.top10 { background: #ff9800; }
        .info {
            margin-left: 12px;
            overflow: hidden;
        }
        .name {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .desc {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
