    const categories = ["鍏ㄩ儴", ...new Set(sites.map(site => site.category))];

    function getFavicon(domain) {
      return "https://www.google.com/s2/favicons?domain=" + domain + "&sz=64";
    }

    function renderTabs() {
      let html = "";
      categories.forEach((category, index) => {
        const value = category === "鍏ㄩ儴" ? "all" : category;
        html += `<button class="tab ${index === 0 ? "active" : ""}" data-c="${value}">${category}</button>`;
      });

      document.getElementById("tabs").innerHTML = html;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", function () {
          document.querySelectorAll(".tab").forEach(node => node.classList.remove("active"));
          this.classList.add("active");
          render(this.dataset.c);
        });
      });
    }

    function render(category = "all") {
      let list = sites;
      if (category !== "all") {
        list = sites.filter(site => site.category === category);
      }

      if (!list.length) {
        document.getElementById("main").innerHTML = '<div class="empty">褰撳墠鍒嗙被涓嬫病鏈夌綉绔欍€?/div>';
        return;
      }

      const grouped = {};
      list.forEach(site => {
        if (!grouped[site.category]) grouped[site.category] = [];
        grouped[site.category].push(site);
      });

      let html = "";
      Object.keys(grouped).forEach(categoryName => {
        const group = grouped[categoryName];
        html += `<section class="category">`;
        html += `<h2 class="cat-title">${categoryName}<span>(${group.length})</span></h2>`;
        html += `<div class="grid">`;
        group.forEach(site => {
          const url = "https://" + site.domain;
          html += `<a href="${url}" target="_blank" rel="noopener" class="card">`;
          html += `<span class="rank">#${site.rank}</span>`;
          html += `<span class="icon"><img src="${getFavicon(site.domain)}" alt="${site.name} logo" loading="lazy" onerror="this.src='https://icons.duckduckgo.com/ip3/${site.domain}.ico'"></span>`;
          html += `<div class="meta"><div class="name">${site.name}</div><div class="desc">${site.desc}</div></div>`;
          html += `</a>`;
        });
        html += `</div></section>`;
      });

      document.getElementById("main").innerHTML = html;
    }

    const themeBtn = document.getElementById("themeBtn");
    const currentTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", currentTheme);
    themeBtn.textContent = currentTheme === "dark" ? "鈽€锔? : "馃寵";

    themeBtn.addEventListener("click", function () {
      const nextTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      localStorage.setItem("theme", nextTheme);
      themeBtn.textContent = nextTheme === "dark" ? "鈽€锔? : "馃寵";
    });

    renderTabs();
