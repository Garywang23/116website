<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top100导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--sub:#666;--border:#e8e8e8;--accent:#4361ee;--cat-bg:#f8f9fa}
[data-theme="dark"]{--bg:#1a1a2e;--card:#16213e;--text:#e0e0e0;--sub:#aaa;--border:#2a2a4a;--accent:#4cc9f0;--cat-bg:#0f3460}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{font-size:22px;font-weight:700;color:var(--accent)}
.search input{padding:8px 16px;border:2px solid var(--border);border-radius:20px;font-size:14px;background:var(--bg);color:var(--text);outline:none;width:300px}
.search input:focus{border-color:var(--accent)}
.theme-btn{background:var(--bg);border:2px solid var(--border);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:16px}
.tabs{max-width:1400px;margin:12px auto;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-size:13px}
.tab.active,.tab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:20px 24px}
.category{margin-bottom:28px}
.cat-title{font-size:16px;font-weight:600;margin-bottom:12px;padding:8px 14px;background:var(--cat-bg);border-radius:6px;border-left:4px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);transition:all .2s}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.icon{width:32px;height:32px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--cat-bg);overflow:hidden}
.icon img{width:24px;height:24px;object-fit:contain}
.name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{text-align:center;padding:30px;color:var(--sub);font-size:12px}
.empty{text-align:center;padding:60px;color:var(--sub)}
@media(max-width:768px){.search input{width:100%}.header{flex-direction:column}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>
<body>
<header class="header">
<div class="logo">🌐 Top100导航</div>
<div class="search"><input type="text" id="search" placeholder="搜索网站..." /></div>
<button class="theme-btn" id="themeBtn">🌙</button>
</header>
<div class="tabs" id="tabs"></div>
<main class="container" id="main"></main>
<footer class="footer">全球流量Top100网站导航 | 共收录 100 个高权重网站</footer>

var sites=S.map(function(s){return{name:s[0],domain:s[1],desc:s[2],category:s[3]}});
var cats=[...new Set(sites.map(function(s){return s.category}))];

function getFavicon(domain){
return "https://www.google.com/s2/favicons?domain="+domain+"&sz=64";
}

function renderTabs(){
var h='<button class="tab active" data-c="all">全部</button>';
cats.forEach(function(c){h+='<button class="tab" data-c="'+c+'">'+c+'</button>';});
document.getElementById('tabs').innerHTML=h;
document.querySelectorAll('.tab').forEach(function(t){
t.onclick=function(){
document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
t.classList.add('active');
render(t.dataset.c,document.getElementById('search').value);
};
});
}

function render(cat,kw){
cat=cat||'all';kw=(kw||'').toLowerCase();
var list=sites;
if(cat!=='all')list=list.filter(function(s){return s.category===cat});
if(kw)list=list.filter(function(s){return s.name.toLowerCase().indexOf(kw)>-1||s.desc.toLowerCase().indexOf(kw)>-1||s.category.toLowerCase().indexOf(kw)>-1||s.domain.toLowerCase().indexOf(kw)>-1});
if(!list.length){document.getElementById('main').innerHTML='<div class="empty">没有找到匹配的网站</div>';return;}
var g={};
list.forEach(function(s){if(!g[s.category])g[s.category]=[];g[s.category].push(s);});
var h='';
for(var c in g){
h+='<section class="category"><h2 class="cat-title">'+c+'（'+g[c].length+'）</h2><div class="grid">';
g[c].forEach(function(s){
var url='https://'+s.domain;
h+='<a href="'+url+'" target="_blank" rel="noopener" class="card">';
h+='<span class="icon"><img src="'+getFavicon(s.domain)+'" alt="'+s.name+'" onerror="this.style.display=\'none\'"></span>';
h+='<div><div class="name">'+s.name+'</div><div class="desc">'+s.desc+'</div></div></a>';
});
h+='</div></section>';
}
document.getElementById('main').innerHTML=h;
}

document.getElementById('search').addEventListener('input',function(e){
var ac=document.querySelector('.tab.active');
render(ac?ac.dataset.c:'all',e.target.value);
});

var btn=document.getElementById('themeBtn');
var theme=localStorage.getItem('theme')||'light';
document.documentElement.setAttribute('data-theme',theme);
btn.textContent=theme==='dark'?'☀️':'🌙';
btn.onclick=function(){
var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
document.documentElement.setAttribute('data-theme',n);
localStorage.setItem('theme',n);
btn.textContent=n==='dark'?'☀️':'🌙';
};

renderTabs();
render();
</script>
