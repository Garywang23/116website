<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>116导航｜全球权重前116名</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1a73e8;--text:#172033;--muted:#667085;--line:#e6eaf0;
  --card:#f8fafc;--shadow:0 10px 28px rgba(16,35,75,.09);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",Arial,sans-serif;
  background:#fff;color:var(--text);min-height:100vh;padding:42px 20px 52px;
}
.header{max-width:1840px;margin:0 auto 34px;text-align:center;position:relative}
h1{font-size:44px;line-height:1;color:var(--blue);font-weight:800;letter-spacing:.5px}
.subtitle{font-size:14px;color:#667085;margin-top:14px}
.source-note{
  position:absolute;right:0;top:4px;text-align:right;font-size:12px;line-height:1.7;color:#8a94a6;
}
.grid{
  max-width:1840px;margin:0 auto;display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));gap:17px 18px;
}
.item{
  position:relative;display:flex;align-items:center;gap:16px;min-height:112px;
  border:1px solid var(--line);border-radius:12px;padding:18px 54px 18px 18px;
  background:var(--card);text-decoration:none;color:inherit;transition:.18s ease;
}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d7deea}
.logo{
  width:64px;height:64px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.08);
  object-fit:contain;padding:8px;box-shadow:0 6px 16px rgba(15,23,42,.06);flex:0 0 64px;
}
.rank{
  position:absolute;right:16px;top:14px;min-width:28px;height:24px;padding:0 8px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;
  background:#1a73e8;line-height:1;
}
.rank.top3{background:#ef3333}.rank.top10{background:#ff9700}
.info{min-width:0;padding-top:2px}
.name-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;min-width:0}
.name{font-size:20px;font-weight:800;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;border-radius:999px;padding:2px 8px;color:#536070;background:rgba(255,255,255,.72);border:1px solid rgba(15,23,42,.06);white-space:nowrap}
.desc{font-size:14.5px;line-height:1.55;color:#4b5565;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.domain{font-size:12px;color:#7b8794;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item[data-country="中国"]{background:linear-gradient(135deg,#fff7f2,#f8fafc 62%)}
.item[data-country="美国"]{background:linear-gradient(135deg,#f2f7ff,#f8fafc 62%)}
.item[data-country="全球"]{background:linear-gradient(135deg,#f0fbff,#f8fafc 62%)}
.item[data-country="英国"]{background:linear-gradient(135deg,#f8f3ff,#f8fafc 62%)}
.item[data-country="日本"]{background:linear-gradient(135deg,#fff3f6,#f8fafc 62%)}
.item[data-country="韩国"]{background:linear-gradient(135deg,#f2f8ff,#f8fafc 62%)}
.item[data-country="俄罗斯"]{background:linear-gradient(135deg,#f3f5ff,#f8fafc 62%)}
.item[data-country="加拿大"]{background:linear-gradient(135deg,#fff2f2,#f8fafc 62%)}
.item[data-country="澳大利亚"]{background:linear-gradient(135deg,#f1fff7,#f8fafc 62%)}
.item[data-country="新加坡"]{background:linear-gradient(135deg,#fff5f0,#f8fafc 62%)}
.item[data-country="印度"]{background:linear-gradient(135deg,#fff9e8,#f8fafc 62%)}
.item[data-country="荷兰"]{background:linear-gradient(135deg,#fff6ec,#f8fafc 62%)}
.item[data-country="瑞典"]{background:linear-gradient(135deg,#eef8ff,#f8fafc 62%)}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:38px}.source-note{position:static;text-align:center;margin-top:10px}}
@media(max-width:560px){body{padding:28px 12px}.grid{grid-template-columns:1fr}.item{min-height:104px}}
</style>
</head>
<body>
<header class="header">
  <h1>116导航</h1>
  <div class="subtitle">全球权重前116名 · 网站快捷入口</div>
  <div class="source-note" id="sourceNote">数据加载中...</div>
</header>
<main class="grid" id="grid"></main>
<script>
const fallbackSites = [];

const countryByTld = {
  cn:"中国", hk:"中国", tw:"中国", jp:"日本", kr:"韩国", ru:"俄罗斯",
  uk:"英国", de:"德国", fr:"法国", in:"印度", au:"澳大利亚", ca:"加拿大",
  sg:"新加坡", nl:"荷兰", se:"瑞典", br:"巴西", it:"意大利", es:"西班牙"
};

function guessCountry(domain) {
  const tld = domain.split(".").pop().toLowerCase();
  if (countryByTld[tld]) return countryByTld[tld];
  return "美国";
}

function logoUrl(domain) {
  return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(domain) + "&sz=128";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function render(list) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  list.slice(0,116).forEach((site, index) => {
    const rank = site.rank || index + 1;
    const domain = (site.domain || site.url || "").replace(/^https?:\/\//,"");
    if (!domain) return;
    const country = site.country || guessCountry(domain);
    const desc = site.desc || "全球高权重网站";
    const name = site.name || domain.replace(/^www\./,"").split(".")[0];
    const a = document.createElement("a");
    a.className = "item";
    a.href = "https://" + domain;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.dataset.country = country;
    let rankClass = "rank";
    if (rank <= 3) rankClass += " top3";
    else if (rank <= 10) rankClass += " top10";
    a.innerHTML = `
      <span class="${rankClass}">${rank}</span>
      <img class="logo" src="${logoUrl(domain)}" alt="" loading="lazy" onerror="this.style.display='none'">
      <div class="info">
        <div class="name-row">
          <div class="name">${escapeHtml(name)}</div>
          <span class="badge">${escapeHtml(country)}</span>
        </div>
        <div class="desc">${escapeHtml(desc)}</div>
        <div class="domain">${escapeHtml(domain)}</div>
      </div>`;
    grid.appendChild(a);
  });
}

async function init() {
  const note = document.getElementById("sourceNote");
  try {
    const res = await fetch("./sites.json", { cache: "no-store" });
    if (!res.ok) throw new Error("sites.json not found");
    const data = await res.json();
    const list = Array.isArray(data) ? data : data.sites;
    render(list);
    const source = data.source === "tranco" ? "Tranco 自动更新" : "备用数据";
    note.innerHTML = `${source}<br>更新日期：${escapeHtml(data.updatedAt || "未标注")}`;
  } catch (e) {
    render(fallbackSites);
    note.innerHTML = `备用数据<br>sites.json 加载失败`;
  }
}
init();
</script>
</body>
</html>
